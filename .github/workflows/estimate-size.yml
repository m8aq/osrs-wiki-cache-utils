name: Estimate hosted snapshot size

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_REPO: ${{ vars.HF_REPO }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  estimate:
    runs-on: ubuntu-24.04
    steps:
      - run: python -m pip install --user --upgrade huggingface_hub
      - name: Project from completed shards
        run: |
          set -euo pipefail
          "$HOME/.local/bin/hf" download "$HF_REPO" \
            --repo-type dataset \
            --include 'shards/0[0-3]/size.json' \
            --local-dir measurements
          mapfile -t FILES < <(find measurements -name size.json -type f | sort)
          test "${#FILES[@]}" -eq 4
          jq -s '
            . as $shards |
            length as $count |
            {
              sampleShards: $count,
              samplePages: (map(.includedPages + .excludedPages) | add),
              projectedRawHtmlBytes: ((map(.rawHtmlBytes) | add) * 32 / $count | round),
              projectedSnapshotBytes: ((map(.snapshotBytes) | add) * 32 / $count | round),
              projectedIndexBytes: ((map(.indexBytes) | add) * 32 / $count | round),
              modelBytes: (map(.modelBytes) | max),
              projectedHostedBytes: ((((map(.snapshotBytes + .indexBytes) | add) * 32 / $count) + (map(.modelBytes) | max)) | round),
              shards: map({shardIndex, includedPages, excludedPages, rawHtmlBytes, snapshotBytes, indexBytes, modelBytes})
            }
          ' "${FILES[@]}" | tee estimate.json
