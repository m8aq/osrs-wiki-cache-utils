[package]
name = "osrs-wiki-cache-utils"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Build and search offline OSRS Wiki, game-cache, and RuneLite source indexes"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
flate2 = "1"
parsoid = "0.10.1"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.1.2", default-features = false, features = ["macros", "server", "transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "sync", "time"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
